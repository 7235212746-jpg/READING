name: Normalize published mathematics

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/normalize_math_delimiters.py"
      - ".github/workflows/normalize-math.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize Markdown mathematics
        run: python scripts/normalize_math_delimiters.py

      - name: Confirm valid mathematics delimiters
        run: python scripts/normalize_math_delimiters.py --check

      - name: Commit corrected source when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "No math-source corrections required."
            exit 0
          fi
          git commit -m "fix: normalize published math delimiters"
          git push
