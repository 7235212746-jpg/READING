<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">三角形反铁磁与 Heisenberg 公式教学示意</title>
  <desc id="desc">左边三角形三个自旋箭头相差约一百二十度，右边逐项解释 H、J、求和符号和自旋内积。</desc>
  <style>
    text { font-family: Arial, 'Noto Sans SC', sans-serif; fill:#18273d; }
    .title { font-size:24px; font-weight:700; }
    .head { font-size:19px; font-weight:700; }
    .small { font-size:16px; fill:#53657a; }
    .bond { stroke:#90a4bd; stroke-width:4; }
    .spin { stroke:#087c69; stroke-width:5; marker-end:url(#a); }
    .arc { fill:none; stroke:#db6e28; stroke-width:2; stroke-dasharray:4 4; }
    .panel { fill:#f8fafc; stroke:#d5deea; stroke-width:2; rx:14; }
    .formula { font-size:26px; font-family: Georgia, serif; }
    .accent { fill:#087c69; font-weight:700; }
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#087c69"/></marker></defs>
  <rect width="980" height="470" fill="#fff"/>
  <text class="title" x="34" y="42">把第一条公式翻译成人话</text>
  <text class="small" x="34" y="68">教学示意：三个相邻自旋都想“尽量相反”，三角形迫使它们分摊冲突。</text>
  <rect class="panel" x="34" y="100" width="386" height="325"/>
  <text class="head" x="60" y="132">三角形上的三个自旋</text>
  <line class="bond" x1="111" y1="333" x2="337" y2="333"/>
  <line class="bond" x1="111" y1="333" x2="224" y2="181"/>
  <line class="bond" x1="224" y1="181" x2="337" y2="333"/>
  <circle cx="111" cy="333" r="9" fill="#27496c"/><circle cx="224" cy="181" r="9" fill="#27496c"/><circle cx="337" cy="333" r="9" fill="#27496c"/>
  <line class="spin" x1="111" y1="333" x2="111" y2="255"/>
  <line class="spin" x1="224" y1="181" x2="292" y2="221"/>
  <line class="spin" x1="337" y1="333" x2="269" y2="373"/>
  <text class="small" x="82" y="365">A</text><text class="small" x="210" y="164">B</text><text class="small" x="345" y="365">C</text>
  <text class="small" x="76" y="402">每对夹角约 120°：没有一边完美，</text>
  <text class="small" x="76" y="422">但三条边公平地降低能量。</text>
  <rect class="panel" x="451" y="100" width="495" height="325"/>
  <text class="formula" x="483" y="151">H = J Σ  Sᵢ · Sⱼ</text>
  <text class="head" x="483" y="194">每个符号在问什么？</text>
  <text class="small" x="483" y="228"><tspan class="accent">H</tspan>：把所有相邻关系加起来后的总能量</text>
  <text class="small" x="483" y="264"><tspan class="accent">J &gt; 0</tspan>：相邻自旋偏爱朝相反方向</text>
  <text class="small" x="483" y="300"><tspan class="accent">Σ</tspan>：每条相邻边都要算一次，再相加</text>
  <text class="small" x="483" y="336"><tspan class="accent">Sᵢ · Sⱼ</tspan>：两个箭头方向是否相近的评分</text>
  <text class="small" x="483" y="388">重点：公式不是门槛，而是“逐边记分”的简写。</text>
</svg>
