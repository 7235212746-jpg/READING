<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <style>
      .math-render-source {
        position: absolute !important;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .math-render-fallback {
        font-family: "Cambria Math", "Times New Roman", serif;
      }
      .math-display-fallback {
        display: block;
        margin: 20px 0;
        padding: 12px 8px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d5ddd7;
        border-radius: 6px;
      }
      .math-ready .math-render-source {
        position: static !important;
        width: auto;
        height: auto;
        overflow: visible;
        clip-path: none;
        white-space: normal;
      }
      .math-ready .math-render-fallback {
        display: none;
      }
    </style>
    <script>
      function readableMathText(math) {
        return math
          .replace(/\\\\/g, '\\')
          .replace(/\\sqrt\{([^{}]+)\}/g, '√($1)')
          .replace(/\\times/g, '×')
          .replace(/\^\{?\\circ\}?/g, '°')
          .replace(/\\mu/g, 'μ')
          .replace(/\\mathrm\{([^{}]+)\}/g, '$1')
          .replace(/\\mathbf\{([^{}]+)\}/g, '$1')
          .replace(/\\cdot/g, '·')
          .replace(/\\langle/g, '〈')
          .replace(/\\rangle/g, '〉')
          .replace(/\\sum/g, 'Σ')
          .replace(/[{}]/g, '')
          .replace(/\\/g, '');
      }
      function appendMathPair(fragment, math, display) {
        const normalized = math.replace(/\\\\/g, '\\');
        const source = document.createElement(display ? 'div' : 'span');
        source.className = 'math-render-source';
        source.textContent = (display ? '\\[' : '\\(') + normalized + (display ? '\\]' : '\\)');
        const fallback = document.createElement(display ? 'div' : 'span');
        fallback.className = 'math-render-fallback' + (display ? ' math-display-fallback' : '');
        fallback.textContent = readableMathText(math);
        fragment.appendChild(source);
        fragment.appendChild(fallback);
      }
      function stagePublishedMath() {
        if (document.documentElement.classList.contains('math-staged')) return;
        const roots = document.querySelectorAll('.article-body');
        const pattern = /\\\\\(([^$\n]+?)\\\\\)|\\\(([^$\n]+?)\\\)|\\\\\[([\s\S]+?)\\\\\]|\\\[([\s\S]+?)\\\]|\$\$([^$\n]+?)\$\$/g;
        roots.forEach((root) => {
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodes = [];
          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement && node.parentElement.closest('code, pre, script, style, .math-render-source, .math-render-fallback')) continue;
            if (pattern.test(node.nodeValue)) nodes.push(node);
            pattern.lastIndex = 0;
          }
          nodes.forEach((textNode) => {
            const fragment = document.createDocumentFragment();
            const text = textNode.nodeValue;
            let last = 0;
            let match;
            pattern.lastIndex = 0;
            while ((match = pattern.exec(text))) {
              fragment.appendChild(document.createTextNode(text.slice(last, match.index)));
              const math = match[1] || match[2] || match[3] || match[4] || match[5];
              const display = Boolean(match[3] || match[4]);
              appendMathPair(fragment, math, display);
              last = pattern.lastIndex;
            }
            fragment.appendChild(document.createTextNode(text.slice(last)));
            textNode.parentNode.replaceChild(fragment, textNode);
          });
        });
        document.documentElement.classList.add('math-staged');
      }
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true
        },
        startup: {
          ready: () => {
            stagePublishedMath();
            MathJax.startup.defaultReady();
          },
          pageReady: () => MathJax.startup.defaultPageReady().then(() => {
            document.documentElement.classList.add('math-ready');
          })
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Kagome Reading</span>
        </a>
        <nav class="nav" aria-label="站点导航">
          <a href="{{ '/' | relative_url }}">今日文章</a>
          <a href="{{ '/methods/' | relative_url }}">阅读入门</a>
          <a href="{{ '/#path' | relative_url }}">知识路径</a>
          <a href="{{ '/about/' | relative_url }}">说明</a>
        </nav>
      </div>
    </header>
    <main class="page">
      {{ content }}
    </main>
    <script>stagePublishedMath();</script>
    <footer class="footer">
      <p>公开学习笔记。结论请回到原论文、补充材料与实验记录核查。</p>
    </footer>
    <script type="module">
      const blocks = document.querySelectorAll('code.language-mermaid');
      if (blocks.length) {
        const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
        blocks.forEach((code) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'mermaid';
          wrapper.textContent = code.textContent;
          code.parentElement.replaceWith(wrapper);
        });
        mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
        await mermaid.run({ querySelector: '.mermaid' });
      }
    </script>
  </body>
</html>
