---
layout: default
---
<article class="article">
  <header class="article-header">
    <p class="track">{{ page.track | default: "学习文章" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="article-meta" aria-label="文章信息">
      <span>{{ page.date | date: "%Y-%m-%d" }}</span>
      <span>难度：{{ page.difficulty }}</span>
    </div>
    <p class="article-summary">{{ page.summary }}</p>
  </header>
  <div class="article-body">
    {{ content }}
  </div>
</article>
